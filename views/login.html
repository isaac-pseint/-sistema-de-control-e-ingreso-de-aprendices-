<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso SENA - Iniciar Sesión</title>
    <!-- Estilos de la aplicación -->
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
    
    <div class="login-container">
        <div class="login-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA Logo" class="login-logo">
            
            <h1>Sistema de Ingreso</h1>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder=" correo aqui">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Contraseña aqui">
                </div>
                
                <button type="submit" class="btn btn-primary" id="btnLogin">Ingresar</button>
            </form>
        </div>
    </div>


</body>
</html>
