<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso SENA - Iniciar Sesión</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>

    <nav class="app-header">
        <a href="login.html" class="app-title btn-a">Sistema de Ingreso</a>
        <div class="btn-group">
            <a href="login.html" class="btn btn-primary btn-sm btn-a">Login</a>
            <a href="entrada.html" class="btn btn-outline btn-sm btn-a">Entrada</a>
            <a href="salida.html" class="btn btn-outline btn-sm btn-a">Salida</a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA Logo" class="login-logo">

            <h1>Sistema de Ingreso</h1>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@sena.edu.co">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="*********">
                </div>

                <button type="submit" class="btn btn-primary" id="btnLogin">Ingresar</button>
            </form>
        </div>
    </div>

    <script type="module" src="../../assets/js/pages/public/login.js"></script>
</body>
</html>
