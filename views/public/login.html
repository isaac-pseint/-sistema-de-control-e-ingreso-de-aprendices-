<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso SENA - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="../../assets/img/sena-colombia-logo-green39a900png-20250120.png">
    <link rel="stylesheet" href="../../assets/css/main.css?v=20261028-2">
</head>
<body>

    <nav class="app-header">
        <a href="login.html" class="app-title btn-a">Sistema de Ingreso</a>
        
    </nav>

    <div class="login-container">
        <div class="login-card">
            <img src="../../assets/img/sena-colombia-logo-green39a900png-20250120.png" alt="SENA Colombia" class="login-logo">

            <h1>Sistema de Ingreso</h1>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@sena.edu.co">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="*********">
                </div>

                <button type="submit" class="btn btn-primary" id="btnLogin">Ingresar</button>
            </form>
        </div>
    </div>

    <script type="module" src="../../assets/js/pages/public/login.js?v=20261028-2"></script>
</body>
</html>
