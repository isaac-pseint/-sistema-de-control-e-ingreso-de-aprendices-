<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Sesión</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body class="app-layout">

    <nav class="app-header">
        <button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menú">☰</button>
        <span id="tituloSeccion" class="app-title"></span>
    </nav>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
        <main class="app-main">

            <nav class="breadcrumb" aria-label="Migas de pan">
                <a href="listado.html">Mis Sesiones</a>
                <span class="breadcrumb-sep">/</span>
                <a href="#" id="linkDetalleSesion">Detalle</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-actual">Editar horario</span>
            </nav>

            <h1 class="titulo-seccion">Editar horario de la sesión</h1>
            <p class="subtitulo-seccion">Ajusta la hora de entrada y la de salida</p>
            <div id="resumenSesion"></div>

            <form id="formEditarSesionInstructor" class="form-grid">
                <input type="hidden" id="id" name="id">
                <div class="form-group">
                    <label for="hora_inicio">Hora inicio</label>
                    <input type="time" id="hora_inicio" name="hora_inicio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="hora_fin">Hora fin</label>
                    <input type="time" id="hora_fin" name="hora_fin" class="form-control" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="#" id="linkVolverDetalle" class="btn btn-outline btn-a">Volver</a>
                </div>
            </form>
        </main>
    </div>

    <script type="module" src="../../../assets/js/pages/instructor/sesiones/editar.js"></script>
</body>
</html>
