<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Sesión</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body class="app-layout">

    <nav class="app-header">
        <button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menú">☰</button>
        <span id="tituloSeccion" class="app-title"></span>
    </nav>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
        <main class="app-main">

            <nav class="breadcrumb" aria-label="Migas de pan">
                <a href="listado.html">Mis sesiones</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-actual">Detalle</span>
            </nav>

            <div class="page-header page-header--acciones">
                <h2>Detalle de la sesión</h2>
                <div id="wrapAccionesSesion" class="sesion-toolbar" hidden>
                    <div class="sesion-toolbar__marcaje" role="group" aria-label="Marcaje">
                        <a href="#" id="linkEntradaSesion" class="btn btn-sm btn-primary btn-a">Entrada</a>
                        <a href="#" id="linkSalidaSesion" class="btn btn-sm btn-outline btn-a">Salida</a>
                    </div>
                    <span class="sesion-toolbar__sep" aria-hidden="true"></span>
                    <div class="sesion-toolbar__gestion" role="group" aria-label="Gestión de la sesión">
                        <span id="wrapLinkEditarSesion" class="sesion-toolbar__editar" hidden>
                            <a href="#" id="linkEditarSesion" class="btn btn-sm btn-outline btn-a">Editar</a>
                        </span>
                        <button type="button" id="btnFinalizarSesion" class="btn btn-sm btn-info btn-auto">Finalizar</button>
                        <button type="button" id="btnCancelarSesion" class="btn btn-sm btn-danger btn-auto">Cancelar</button>
                    </div>
                </div>
            </div>

            <div id="detalleSesion"></div>

            <section class="seccion-aprendices" aria-labelledby="tituloAprendices">
                <h3 id="tituloAprendices" class="titulo-seccion">Aprendices</h3>

            <div class="filtro-inputs seccion-aprendices__filtros">
                <div class="form-group">
                    <label for="filtroPresencia">Mostrar</label>
                    <select id="filtroPresencia" class="form-control">
                        <option value="todos">Todos</option>
                        <option value="asistencias">Asistencias</option>
                        <option value="inasistencias">Inasistencias</option>
                    </select>
                </div>
                <div class="form-group" id="filtroAnomaliaGrupo">
                    <label for="filtroAnomalia">Filtro</label>
                    <select id="filtroAnomalia" class="form-control">
                        <option value="todos">Ninguno</option>
                        <option value="retardos">Entradas tarde</option>
                        <option value="salidas_tempranas">Salida antes del fin</option>
                    </select>
                </div>
            </div>

            <table class="table-admin">
                <thead>
                    <tr>
                        <th>Aprendiz</th>
                        <th>Identificación</th>
                        <th>Estado</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Retardo (min)</th>
                        <th>Min. antes del fin</th>
                    </tr>
                </thead>
                <tbody id="tablaAprendices"></tbody>
            </table>
            <div id="contenedorMensajes" class="mensaje-vacio"></div>
            </section>
        </main>
    </div>

    <div id="modalCancelarSesionInstructor" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header"><h3>Cancelar sesión</h3>
                <button type="button" class="modal-close" id="btnCerrarModalCancelarInstructor">×</button></div>
            <div class="modal-body"><p class="modal-detalle" id="modalCancelarSesionInstructorDetalle"></p></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline btn-auto" id="btnCancelarModalCancelarInstructor">No</button>
                <button type="button" class="btn btn-danger btn-auto" id="btnConfirmarCancelarInstructor">Sí, cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalFinalizarSesion" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header"><h3>Finalizar sesión</h3>
                <button type="button" class="modal-close" id="btnCerrarModalFinalizar">×</button></div>
            <div class="modal-body"><p class="modal-detalle" id="modalFinalizarSesionDetalle"></p></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline btn-auto" id="btnCancelarModalFinalizar">No</button>
                <button type="button" class="btn btn-info btn-auto" id="btnConfirmarFinalizar">Sí, finalizar</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../../assets/js/pages/instructor/sesiones/detalle.js"></script>
</body>
</html>
