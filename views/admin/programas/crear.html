<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Programa</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../assets/css/main.css">
</head>

<body>

    <nav class="app-header">
        <a href="../dashboard.html" class="app-title btn-a">Sistema de Ingreso</a>
        <div class="btn-group">
            <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h1>Crear Programa</h1>

            <form id="formCrearPrograma" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre del programa</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción (opcional)</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="3"></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="btnGuardarPrograma">Guardar Programa</button>
                    <a href="listado.html" class="btn btn-outline btn-a">Volver</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../../assets/js/pages/admin/programas/crear.js"></script>
</body>

</html>
