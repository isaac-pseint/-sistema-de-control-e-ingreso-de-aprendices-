<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Sesión</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body class="app-layout">
    <nav class="app-header">
        <button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menú">☰</button>
        <span id="tituloSeccion" class="app-title"></span>
    </nav>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
        <main class="app-main">
            <nav class="breadcrumb" aria-label="Migas de pan">
                <a href="listado.html">Sesiones</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-actual">Editar</span>
            </nav>
            <h2>Editar sesión</h2>
            <p id="avisoSesionProgramacion" class="aviso-formulario" hidden></p>
            <form id="formEditarSesion" class="form-grid">
                <input type="hidden" id="id" name="id">
                <div class="form-group">
                    <label for="ficha_id">Ficha</label>
                    <select id="ficha_id" name="ficha_id" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label for="competencia_id">Competencia</label>
                    <select id="competencia_id" name="competencia_id" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Instructor (según competencia)</label>
                    <p id="instructorSesionTexto" class="campo-lectura">—</p>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="hora_inicio">Hora inicio</label>
                    <input type="time" id="hora_inicio" name="hora_inicio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="hora_fin">Hora fin</label>
                    <input type="time" id="hora_fin" name="hora_fin" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" class="form-control" required>
                        <option value="Activo">Activo</option>
                        <option value="Finalizada">Finalizada</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="listado.html" class="btn btn-outline btn-a">Volver</a>
                </div>
            </form>
        </main>
    </div>
    <script type="module" src="../../../assets/js/pages/admin/sesiones/editar.js"></script>
</body>
</html>
