<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ficha</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body>

    <nav class="app-header">
        <a href="dashboard.html" class="app-title btn-a">Sistema de Ingreso</a>
        <div class="btn-group">
            <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h1>Editar Ficha</h1>

            <form id="formEditarFicha">
                <input type="hidden" id="id" name="id">

                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" class="form-control" required>
                    <span class="campo-error error-text" id="error-codigo"></span>
                </div>

                <div class="form-group">
                    <label for="programa_id">Programa</label>
                    <select id="programa_id" name="programa_id" class="form-control" required>
                        <option value="">Seleccione un programa...</option>
                    </select>
                    <span class="campo-error error-text" id="error-programa_id"></span>
                </div>

                <div class="form-group">
                    <label for="instructor_id">Instructor Líder</label>
                    <select id="instructor_id" name="instructor_id" class="form-control" required>
                        <option value="">Seleccione un instructor...</option>
                    </select>
                    <span class="campo-error error-text" id="error-instructor_id"></span>
                </div>

                <div class="form-group">
                    <label for="hora_entrada">Hora de Entrada (opcional)</label>
                    <input type="time" id="hora_entrada" name="hora_entrada" class="form-control">
                    <span class="campo-error error-text" id="error-hora_entrada"></span>
                </div>

                <div class="form-group">
                    <label for="hora_salida">Hora de Salida (opcional)</label>
                    <input type="time" id="hora_salida" name="hora_salida" class="form-control">
                    <span class="campo-error error-text" id="error-hora_salida"></span>
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" class="form-control" required>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                    <span class="campo-error error-text" id="error-estado"></span>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="btnActualizarFicha">Actualizar Ficha</button>
                    <a href="fichas.html" class="btn btn-outline btn-a">Volver</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../../assets/js/pages/admin-editar-ficha.js"></script>
</body>
</html>
