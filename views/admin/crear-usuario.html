<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/estilos.css">
</head>
<body>

    <nav class="app-header">
        <a href="../admin/dashboard.html" class="app-title btn-a">Sistema de Ingreso</a>
        <div class="btn-group">
            <button id="btnLogout" class="btn btn-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h1>Crear Usuario</h1>

            <form id="formCrearUsuario" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="identificacion">Identificación</label>
                    <input type="text" id="identificacion" name="identificacion" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="rol_id">Rol</label>
                    <select id="rol_id" name="rol_id" class="form-control" required>
                        <option value="">Seleccione un rol...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ficha_id">Ficha (Opcional)</label>
                    <select id="ficha_id" name="ficha_id" class="form-control">
                        <option value="">Seleccione una ficha...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="codigo_llavero">Código Llavero (Opcional)</label>
                    <input type="text" id="codigo_llavero" name="codigo_llavero" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary" id="btnCrearUsuario">Crear Usuario</button>
            </form>
        </div>
    </div>

    <script type="module" src="../../assets/js/pages/admin-crear-usuario.js"></script>
</body>
</html>
