<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ficha</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../../assets/css/main.css">
</head>
<body class="app-layout">

    <nav class="app-header">
        <button id="btnMenu" class="btn-menu" type="button" aria-label="Abrir menú">☰</button>
        <span id="tituloSeccion" class="app-title"></span>
    </nav>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
        <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
        <main class="app-main">

            <nav class="breadcrumb" aria-label="Migas de pan">
                <a href="listado.html">Listado de Fichas</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-actual">Crear Ficha</span>
            </nav>

            <h2>Crear Ficha</h2>

            <form id="formCrearFicha" class="form-grid">
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" class="form-control" required>
                    <span class="campo-error error-text" id="error-codigo"></span>
                </div>

                <div class="form-group">
                    <label for="programa_id">Programa</label>
                    <select id="programa_id" name="programa_id" class="form-control" required>
                        <option value="">Seleccione un programa...</option>
                    </select>
                    <span class="campo-error error-text" id="error-programa_id"></span>
                </div>

                <div class="form-group">
                    <label for="instructor_id">Instructor Líder</label>
                    <select id="instructor_id" name="instructor_id" class="form-control" required>
                        <option value="">Seleccione un instructor...</option>
                    </select>
                    <span class="campo-error error-text" id="error-instructor_id"></span>
                </div>

                <div class="form-group">
                    <label for="hora_entrada">Hora de Entrada (opcional)</label>
                    <input type="time" id="hora_entrada" name="hora_entrada" class="form-control">
                    <span class="campo-error error-text" id="error-hora_entrada"></span>
                </div>

                <div class="form-group">
                    <label for="hora_salida">Hora de Salida (opcional)</label>
                    <input type="time" id="hora_salida" name="hora_salida" class="form-control">
                    <span class="campo-error error-text" id="error-hora_salida"></span>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" id="btnGuardarFicha">Guardar Ficha</button>
                    <a href="listado.html" class="btn btn-outline btn-a">Volver</a>
                </div>
            </form>
        </main>
    </div>

    <script type="module" src="../../../assets/js/pages/admin/fichas/crear.js"></script>
</body>
</html>
